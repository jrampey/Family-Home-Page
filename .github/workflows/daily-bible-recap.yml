name: Update Family Home Page

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update Bible recap
        run: node scripts/update-daily.mjs
      - name: Update Apple Calendar
        env:
          APPLE_CALENDAR_URL: ${{ secrets.APPLE_CALENDAR_URL }}
        run: node scripts/update-calendar.mjs
      - name: Commit updated data
        run: |
          git add daily-data.json personal/calendar-data.json
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "family-home-page-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Update family home page data"
          git push
