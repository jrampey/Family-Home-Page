name: Update Daily Bible Recap
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update recap data
        run: node scripts/update-daily.mjs
      - name: Commit daily data
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "family-home-page-bot"
          git config user.email "github-actions@users.noreply.github.com"
          git add daily-data.json
          git commit -m "Update daily Bible recap"
          git push
