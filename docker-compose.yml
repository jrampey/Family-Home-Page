services:
  family-home-page:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      APPLE_CALENDAR_URL: ${APPLE_CALENDAR_URL:-}
    volumes:
      - family-home-data:/data
volumes:
  family-home-data: