<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Bible Recap for Kids</title>
<style>:root{--bg:#f7f5ef;--card:#fff;--ink:#26332b;--muted:#69746d;--accent:#56725f;--line:#e5e1d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;line-height:1.55}main{width:min(920px,calc(100% - 32px));margin:auto;padding:42px 0 64px}header{text-align:center;margin-bottom:28px}.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:0 0 10px}.sub,.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(45,55,48,.05);margin:16px 0}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#eef2ed;color:var(--accent);font-weight:800;font-size:.86rem}h2{margin:8px 0 4px;font-size:1.5rem}.video{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:16px;background:#111;margin-top:16px}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.summary{font-size:1.08rem}.takeaway{border-left:4px solid var(--accent);padding:2px 0 2px 14px;margin-top:18px;font-weight:700}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;text-decoration:none;color:#fff;background:var(--accent);padding:10px 14px;border-radius:12px;font-weight:800}.btn.secondary{color:var(--ink);background:#f2f0ea;border:1px solid var(--line)}footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:28px}</style>
</head><body><main>
<header><p class="eyebrow">Our Family Bible Time</p><h1>Today’s Bible Recap</h1><p class="sub" id="todayLabel"></p></header>
<section class="card"><div class="topline"><span class="pill" id="dayPill"></span><span class="muted" id="ageLabel"></span></div><h2 id="scriptureTitle"></h2><div class="video"><iframe id="videoFrame" title="The Bible Recap" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="links"><a class="btn" id="bibleLink" target="_blank" rel="noreferrer">Read on Bible.com</a><a class="btn secondary" id="youtubeLink" target="_blank" rel="noreferrer">Open on YouTube</a></div></section>
<section class="card summary"><p class="eyebrow">Kid-friendly summary</p><h2 id="summaryTitle"></h2><div id="summaryBody"></div><div class="takeaway" id="takeaway"></div></section>
<footer>The day is calculated automatically from today’s date. Scripture follows The Bible Recap chronological plan. Kid summaries are original age-adjusted recaps.</footer>
</main><script>
const child={name:'Ava',birthdate:'2018-11-07T12:00:00'};
const readings={
255:{scripture:'Joel 1–3'},256:{scripture:'Daniel 1–3',video:'8tm3eQTPY7E',title:'God is with us when standing for what is right',summary:`<p>Daniel and his friends were taken far away from home to Babylon. Even though they were living in a place where many people did not follow God, they decided they would still honor Him. God gave Daniel and his friends wisdom and helped them as they tried to do what was right.</p><p>God also gave Daniel the ability to understand King Nebuchadnezzar’s mysterious dream. Daniel made sure everyone knew that the answer came from God—not from Daniel being especially clever. The dream showed that earthly kingdoms come and go, but God is ultimately in control.</p><p>Later, Shadrach, Meshach, and Abednego refused to worship the king’s golden statue. They were thrown into a blazing furnace, but God protected them. The king was amazed when he saw that they were not alone in the fire.</p>`,takeaway:'For Ava: You can choose what is right even when other people are making a different choice. God is with His people in scary or difficult moments, and He is more powerful than anything we face.'},257:{scripture:'Daniel 4–6'},258:{scripture:'Daniel 7–9'},259:{scripture:'Daniel 10–12'},260:{scripture:'Ezra 1–3'},261:{scripture:'Ezra 4–6; Psalm 137'},262:{scripture:'Haggai 1–2'},263:{scripture:'Zechariah 1–4'},264:{scripture:'Zechariah 5–9'},265:{scripture:'Zechariah 10–14'}
};
const now=new Date();
const start=new Date(now.getFullYear(),0,0);const planDay=Math.floor((now-start)/86400000);
const birth=new Date(child.birthdate);let age=now.getFullYear()-birth.getFullYear();if(now.getMonth()<birth.getMonth()||(now.getMonth()===birth.getMonth()&&now.getDate()<birth.getDate()))age--;
const data=readings[planDay]||{scripture:`The Bible Recap — Day ${planDay}`,title:'Today’s Bible reading',summary:'<p>Open today’s Bible.com reading and Bible Recap video below.</p>',takeaway:`For ${child.name}: Read today’s passage together and talk about what it teaches us about God.`};
document.getElementById('dayPill').textContent=`Day ${planDay} of 365`;
document.getElementById('ageLabel').textContent=`Written for ${child.name}, age ${age}`;
document.getElementById('todayLabel').textContent=`${now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} • A daily recap made for ${child.name}.`;
document.getElementById('scriptureTitle').textContent=data.scripture;document.getElementById('summaryTitle').textContent=data.title||'Today’s Bible reading';document.getElementById('summaryBody').innerHTML=data.summary||'<p>Read today’s passage together using the links above.</p>';document.getElementById('takeaway').textContent=data.takeaway||`For ${child.name}: What did today’s reading teach you about God?`;
const bible=`https://www.bible.com/reading-plans/42399-the-bible-recap-with-tara-leigh-cobble/day/${planDay}`;document.getElementById('bibleLink').href=bible;
const yt=data.video?`https://www.youtube.com/watch?v=${data.video}`:`https://www.youtube.com/results?search_query=The+Bible+Recap+Day+${planDay}`;document.getElementById('youtubeLink').href=yt;document.getElementById('videoFrame').src=data.video?`https://www.youtube.com/embed/${data.video}`:`https://www.youtube.com/embed?listType=search&list=The%20Bible%20Recap%20Day%20${planDay}`;
</script></body></html>
