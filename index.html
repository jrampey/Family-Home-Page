<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Bible Recap for Kids</title><style>:root{--bg:#f7f5ef;--card:#fff;--ink:#26332b;--muted:#69746d;--accent:#56725f;--line:#e5e1d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;line-height:1.55}main{width:min(920px,calc(100% - 32px));margin:auto;padding:42px 0 64px}header{text-align:center;margin-bottom:28px}.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:0 0 10px}.sub,.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(45,55,48,.05);margin:16px 0}.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#eef2ed;color:var(--accent);font-weight:800;font-size:.86rem}h2{margin:8px 0 4px;font-size:1.5rem}.summary{font-size:1.08rem}.takeaway{border-left:4px solid var(--accent);padding:2px 0 2px 14px;margin-top:18px;font-weight:700}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;text-decoration:none;color:#fff;background:var(--accent);padding:10px 14px;border-radius:12px;font-weight:800}.btn.secondary{color:var(--ink);background:#f2f0ea;border:1px solid var(--line)}footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:28px}</style></head><body><main><header><p class="eyebrow">Our Family Bible Time</p><h1>Today’s Bible Recap</h1><p class="sub" id="todayLabel"></p></header><section class="card"><div class="topline"><span class="pill" id="dayPill"></span><span class="muted" id="ageLabel"></span></div><h2 id="scriptureTitle"></h2><div class="links"><a class="btn" id="bibleLink" target="_blank" rel="noreferrer">Read on Bible.com</a><a class="btn secondary" id="youtubeLink" target="_blank" rel="noreferrer">Watch today’s recap</a></div></section><section class="card summary"><p class="eyebrow">Kid-friendly summary</p><h2 id="summaryTitle"></h2><div id="summaryBody"></div><div class="takeaway" id="takeaway"></div></section><footer>Updates automatically each day. No OpenAI API key required.</footer></main><script src="app.js"></script></body></html>
