<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#56725f"><link rel="icon" href="favicon.svg?v=3" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=3"><title>Family Home</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--accent:#56725f;--line:rgba(0,0,0,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;line-height:1.5}main{width:min(980px,calc(100% - 32px));margin:auto;padding:28px 0 70px;position:relative}header{text-align:left;margin:0 0 20px;padding:0 4px}header h1{font-size:clamp(2.5rem,7vw,4.4rem);line-height:1;letter-spacing:-.055em;margin:0 0 8px}h2{letter-spacing:-.025em}.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:750;font-size:.82rem}.sub,.muted{color:var(--muted)}.card{background:#fff;border:0;border-radius:28px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.035);margin:18px 0}.calendar-card{display:none}.calendar-card.active{display:block}.calendar-link,.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.agenda{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.agenda-day{background:#f5f5f7;border-radius:20px;padding:17px 15px}.agenda-day.today{background:var(--profile-soft,#eef2ed)}.agenda-day h3{margin:0 0 3px;font-size:1.3rem}.agenda-date,.event-time,.sync-status{font-size:.78rem;color:var(--muted)}.event{padding:9px 0;border-top:1px solid var(--line)}.event-title{font-weight:700}.empty{font-size:.85rem;color:var(--muted);padding-top:8px}.pill,.connected{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--profile-soft,#eef2ed);color:var(--accent);font-weight:750;font-size:.86rem}.summary{font-size:1.08rem}.summary-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.speak-controls,.links,.gate-actions{display:flex;gap:8px;flex-wrap:wrap}.speak-btn,.btn{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none}.btn{background:var(--accent);color:#fff}.btn.secondary,.speak-btn{background:#f5f5f7;color:var(--ink)}.speak-btn.stop{display:none}.speak-status{font-size:.78rem;color:var(--muted)}.takeaway{border-left:3px solid var(--accent);padding-left:14px;margin-top:18px;font-weight:700}.progress-wrap{margin-top:22px}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}.progress-track{height:7px;background:#e5e5e7;border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:var(--accent)}.gear{position:absolute;right:4px;top:28px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.06);font-size:20px;cursor:pointer}dialog{width:min(580px,calc(100% - 28px));max-height:85vh;overflow:auto;border:0;border-radius:24px;padding:0;color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.25);backdrop-filter:blur(3px)}.settings,.parent-gate{padding:24px}.settings-head{display:flex;align-items:center;justify-content:space-between}.close{border:0;background:transparent;font-size:26px}.setting{padding:18px 0;border-top:1px solid var(--line)}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;margin:0 0 10px;background:#fff}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:.8rem;color:var(--muted);margin-left:8px}.parent-gate{text-align:center}.math-question{font-size:2rem;font-weight:800}.gate-answer{width:150px;text-align:center;margin:12px auto;display:block}@media(max-width:700px){main{width:calc(100% - 20px);padding-top:64px}.agenda,.field-row{grid-template-columns:1fr}.card{padding:22px;border-radius:24px}.gear{top:14px}}
</style>
</head><body><main>
<button class="gear" id="settingsButton" aria-label="Open parent settings">⚙︎</button>
<header><p class="eyebrow">Our Family</p><h1>Family Home</h1><p class="sub" id="todayLabel"></p></header>
<section class="card calendar-card" id="calendarCard"><div class="calendar-link"><p class="eyebrow">Family Calendar</p><span class="sync-status" id="calendarSync"></span></div><div id="calendarContent"><p class="muted">Loading calendar…</p></div></section>
<section class="card"><div class="topline"><span class="pill" id="dayPill"></span><span class="muted" id="ageLabel"></span></div><h2 id="scriptureTitle"></h2><div class="links"><a class="btn" id="bibleLink" target="_blank" rel="noreferrer">Read on Bible.com</a><a class="btn secondary" id="youtubeLink" target="_blank" rel="noreferrer">Watch today’s recap</a></div><div class="progress-wrap"><div class="progress-label"><strong id="progressText"></strong><span id="progressPercent"></span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div></section>
<section class="card summary"><div class="summary-head"><p class="eyebrow">Kid-friendly summary</p><div><div class="speak-controls"><button class="speak-btn" id="readSummary">🔊 Read aloud</button><button class="speak-btn stop" id="stopSummary">■ Stop</button></div><div class="speak-status" id="speakStatus"></div></div></div><h2 id="summaryTitle"></h2><div id="summaryBody"></div><div class="takeaway" id="takeaway"></div></section>
</main>
<dialog id="parentGate"><div class="parent-gate"><p class="eyebrow">Grown-ups only</p><h2>Quick check</h2><div class="math-question" id="mathQuestion"></div><form id="gateForm"><input class="field gate-answer" id="mathAnswer" type="number" required><div class="gate-actions"><button class="btn">Continue</button><button class="btn secondary" id="cancelGate" type="button">Cancel</button></div></form><p id="gateError"></p></div></dialog>
<dialog id="settingsDialog"><div class="settings"><div class="settings-head"><h2>Parent Settings</h2><button class="close" id="closeSettings">×</button></div><div class="setting"><h3>Profile</h3><div class="field-row"><input class="field" id="childName" placeholder="Profile name"><input class="field" id="childBirthday" type="date"></div><button class="btn secondary" id="saveChild">Save profile</button><span class="status" id="childStatus"></span></div><div class="setting"><h3>Apple Calendar</h3><span class="connected">Connected</span></div><div class="setting"><h3>Skylight Calendar</h3><input class="field" id="skylightCalendar" type="url"><button class="btn secondary" data-save="skylightCalendar">Save connection</button><span class="status" id="skylightCalendarStatus"></span></div><div class="setting"><h3>Embed</h3><input class="field" id="embedUrl" type="url"><button class="btn secondary" data-save="embedUrl">Save embed</button><span class="status" id="embedUrlStatus"></span></div></div></dialog>
<script src="app.js?v=20260916-3"></script><script src="favorites-ui.js?v=20260916-3"></script><script src="layout-ui.js?v=20260916-4"></script>
<script>
const dlg=document.getElementById('settingsDialog'),gate=document.getElementById('parentGate'),card=document.getElementById('calendarCard'),content=document.getElementById('calendarContent');let gateAnswer=0;function newMathChallenge(){let a=Math.floor(Math.random()*39)+12,b=Math.floor(Math.random()*19)+3;gateAnswer=a+b;mathQuestion.textContent=`${a} + ${b} = ?`;mathAnswer.value='';gateError.textContent=''}settingsButton.onclick=()=>{newMathChallenge();gate.showModal()};cancelGate.onclick=()=>gate.close();gateForm.onsubmit=e=>{e.preventDefault();if(Number(mathAnswer.value)===gateAnswer){gate.close();dlg.showModal()}else{gateError.textContent='Not quite — try another one.';setTimeout(newMathChallenge,450)}};closeSettings.onclick=()=>dlg.close();
const pNow=new Date(),pStart=new Date(pNow.getFullYear(),0,0),pDay=Math.floor((pNow-pStart)/86400000),pTotal=new Date(pNow.getFullYear(),1,29).getMonth()===1?366:365,pPct=Math.min(100,pDay/pTotal*100);progressText.textContent=pDay+' of '+pTotal+' days complete';progressPercent.textContent=Math.round(pPct)+'%';progressFill.style.width=pPct+'%';
const esc=v=>(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderAgenda(events){const base=new Date();base.setHours(0,0,0,0);content.innerHTML='<div class="agenda">'+[[-1,'Yesterday'],[0,'Today'],[1,'Tomorrow']].map(([offset,label])=>{const day=new Date(base);day.setDate(day.getDate()+offset);const next=new Date(day);next.setDate(next.getDate()+1);const list=events.filter(e=>e.start<next&&(e.end||new Date(e.start.getTime()+1))>day);return'<div class="agenda-day"><h3>'+label+'</h3><div class="agenda-date">'+day.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</div>'+(list.length?list.map(e=>'<div class="event"><div class="event-title">'+esc(e.title)+'</div><div class="event-time">'+(e.allDay?'All day':e.start.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}))+'</div></div>').join(''):'<div class="empty">Nothing scheduled</div>')+'</div>'}).join('')+'</div>'}async function renderCalendar(){card.classList.add('active');try{const r=await fetch('personal/calendar-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json(),events=(data.events||[]).map(e=>({...e,start:new Date(e.start),end:e.end?new Date(e.end):null}));renderAgenda(events);if(data.updated)calendarSync.textContent='Synced '+new Date(data.updated).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})}catch{content.innerHTML='<p class="muted">Calendar data is temporarily unavailable.</p>'}}renderCalendar();
</script></body></html>
