<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Daily Bible Recap for Kids</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#26332b;--muted:#69746d;--accent:#56725f;--line:#e5e1d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;line-height:1.55}main{width:min(920px,calc(100% - 32px));margin:auto;padding:42px 0 64px;position:relative}header{text-align:center;margin-bottom:28px}.eyebrow{margin:0 0 6px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:0 0 10px}h2{margin:8px 0 4px;font-size:1.5rem}.sub,.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(45,55,48,.05);margin:16px 0}.calendar-card{display:none}.calendar-card.active{display:block}.calendar-link,.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.agenda{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.agenda-day{background:#f8f7f3;border:1px solid var(--line);border-radius:15px;padding:14px;min-width:0}.agenda-day.today{background:#eef2ed;border-color:#d8e1d9}.agenda-day h3{margin:0 0 2px;font-size:1rem}.agenda-date{font-size:.78rem;color:var(--muted);margin-bottom:10px}.event{padding:9px 0;border-top:1px solid var(--line)}.event:first-of-type{border-top:0}.event-title{font-weight:750;line-height:1.25}.event-time{font-size:.78rem;color:var(--muted);margin-top:2px}.empty{font-size:.85rem;color:var(--muted);padding-top:8px}.calendar-error{color:var(--muted);font-size:.9rem;margin:14px 0 0}.sync-status{color:var(--muted);font-size:.78rem}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#eef2ed;color:var(--accent);font-weight:800;font-size:.86rem}.summary{font-size:1.08rem}.summary-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.summary-head .eyebrow{margin-top:7px}.speak-controls{display:flex;gap:7px;align-items:center}.speak-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #d8e1d9;background:#eef2ed;color:var(--accent);border-radius:999px;padding:8px 12px;font:inherit;font-size:.84rem;font-weight:800;cursor:pointer}.speak-btn.stop{display:none}.speak-status{font-size:.78rem;color:var(--muted);margin-top:7px;text-align:right;min-height:1.2em}.takeaway{border-left:4px solid var(--accent);padding:2px 0 2px 14px;margin-top:18px;font-weight:700}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-block;text-decoration:none;color:#fff;background:var(--accent);padding:10px 14px;border-radius:12px;font-weight:800;border:0;cursor:pointer}.btn.secondary{color:var(--ink);background:#f2f0ea;border:1px solid var(--line)}.progress-wrap{margin-top:22px}.progress-label{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:8px;font-size:.9rem;color:var(--muted)}.progress-label strong{color:var(--ink);font-size:1rem}.progress-track{height:10px;background:#e7ebe6;border-radius:999px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--accent);border-radius:999px}.gear{position:absolute;right:0;top:24px;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--card);font-size:20px;cursor:pointer}dialog{width:min(560px,calc(100% - 28px));border:1px solid var(--line);border-radius:22px;padding:0;color:var(--ink)}.settings,.parent-gate{padding:24px}.settings-head{display:flex;align-items:center;justify-content:space-between}.close{border:0;background:transparent;font-size:26px}.setting{padding:18px 0;border-top:1px solid var(--line)}.field{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;margin:0 0 10px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:.8rem;color:var(--muted);margin-left:8px}.connected{display:inline-flex;padding:7px 11px;background:#eef2ed;color:var(--accent);border-radius:999px;font-weight:800}.parent-gate{text-align:center}.math-question{font-size:2rem;font-weight:900}.gate-answer{width:150px;text-align:center;margin:auto;display:block}.gate-actions{display:flex;justify-content:center;gap:9px}.gate-error{color:#a34848}@media(max-width:700px){.agenda{grid-template-columns:1fr}.field-row{grid-template-columns:1fr}main{padding-top:62px}}
</style></head><body><main><button class="gear" id="settingsButton" aria-label="Open parent settings">⚙︎</button><section class="card calendar-card" id="calendarCard"><div class="calendar-link"><p class="eyebrow">Family Calendar</p><span class="sync-status" id="calendarSync"></span></div><div id="calendarContent"><p class="muted">Loading calendar…</p></div></section><header><p class="eyebrow">Our Family Bible Time</p><h1>Today’s Bible Recap</h1><p class="sub" id="todayLabel"></p></header><section class="card"><div class="topline"><span class="pill" id="dayPill"></span><span class="muted" id="ageLabel"></span></div><h2 id="scriptureTitle"></h2><div class="links"><a class="btn" id="bibleLink" target="_blank" rel="noreferrer">Read on Bible.com</a><a class="btn secondary" id="youtubeLink" target="_blank" rel="noreferrer">Watch today’s recap</a></div><div class="progress-wrap"><div class="progress-label"><strong id="progressText"></strong><span id="progressPercent"></span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div></section><section class="card summary"><div class="summary-head"><p class="eyebrow">Kid-friendly summary</p><div><div class="speak-controls"><button class="speak-btn" id="readSummary">🔊 Read aloud</button><button class="speak-btn stop" id="stopSummary">■ Stop</button></div><div class="speak-status" id="speakStatus"></div></div></div><h2 id="summaryTitle"></h2><div id="summaryBody"></div><div class="takeaway" id="takeaway"></div></section></main><dialog id="parentGate"><div class="parent-gate"><p class="eyebrow">Grown-ups only</p><h2>Quick check</h2><div class="math-question" id="mathQuestion"></div><form id="gateForm"><input class="field gate-answer" id="mathAnswer" type="number" required><div class="gate-actions"><button class="btn">Continue</button><button class="btn secondary" id="cancelGate" type="button">Cancel</button></div></form><p class="gate-error" id="gateError"></p></div></dialog><dialog id="settingsDialog"><div class="settings"><div class="settings-head"><h2>Parent Settings</h2><button class="close" id="closeSettings">×</button></div><div class="setting"><h3>Profile</h3><div class="field-row"><input class="field" id="childName" placeholder="Profile name"><input class="field" id="childBirthday" type="date"></div><button class="btn secondary" id="saveChild">Save profile</button><span class="status" id="childStatus"></span></div><div class="setting"><h3>Apple Calendar</h3><span class="connected">Connected</span></div><div class="setting"><h3>Skylight Calendar</h3><input class="field" id="skylightCalendar" type="url"><button class="btn secondary" data-save="skylightCalendar">Save connection</button><span class="status" id="skylightCalendarStatus"></span></div><div class="setting"><h3>Embed</h3><input class="field" id="embedUrl" type="url"><button class="btn secondary" data-save="embedUrl">Save embed</button><span class="status" id="embedUrlStatus"></span></div></div></dialog><script src="app.js"></script><script src="favorites-ui.js"></script><script>
const dlg=document.getElementById('settingsDialog'),gate=document.getElementById('parentGate'),card=document.getElementById('calendarCard'),content=document.getElementById('calendarContent');let gateAnswer=0;function newMathChallenge(){let a=Math.floor(Math.random()*39)+12,b=Math.floor(Math.random()*19)+3;gateAnswer=a+b;mathQuestion.textContent=`${a} + ${b} = ?`;mathAnswer.value='';gateError.textContent=''}settingsButton.onclick=()=>{newMathChallenge();gate.showModal()};cancelGate.onclick=()=>gate.close();gateForm.onsubmit=e=>{e.preventDefault();if(Number(mathAnswer.value)===gateAnswer){gate.close();dlg.showModal()}else{gateError.textContent='Not quite — try another one.';setTimeout(newMathChallenge,450)}};closeSettings.onclick=()=>dlg.close();childName.value=localStorage.getItem('family.childName')||'';childBirthday.value=localStorage.getItem('family.childBirthday')||'';saveChild.onclick=()=>{const n=childName.value.trim(),b=childBirthday.value;if(!n)return;localStorage.setItem('family.childName',n);if(b)localStorage.setItem('family.childBirthday',b);else localStorage.removeItem('family.childBirthday');childStatus.textContent='Saved';setTimeout(()=>location.reload(),450)};const pNow=new Date(),pStart=new Date(pNow.getFullYear(),0,0),pDay=Math.floor((pNow-pStart)/86400000),pTotal=new Date(pNow.getFullYear(),1,29).getMonth()===1?366:365,pPct=Math.min(100,pDay/pTotal*100);progressText.textContent=pDay+' of '+pTotal+' days complete';progressPercent.textContent=Math.round(pPct)+'%';progressFill.style.width=pPct+'%';const esc=v=>(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderAgenda(events){const base=new Date();base.setHours(0,0,0,0);const days=[[-1,'Yesterday'],[0,'Today'],[1,'Tomorrow']];content.innerHTML='<div class="agenda">'+days.map(([offset,label])=>{const day=new Date(base);day.setDate(day.getDate()+offset);const next=new Date(day);next.setDate(next.getDate()+1);const list=events.filter(e=>e.start<next&&(e.end||new Date(e.start.getTime()+1))>day);return'<div class="agenda-day '+(offset===0?'today':'')+'"><h3>'+label+'</h3><div class="agenda-date">'+day.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</div>'+(list.length?list.map(e=>'<div class="event"><div class="event-title">'+esc(e.title)+'</div><div class="event-time">'+(e.allDay?'All day':e.start.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}))+'</div></div>').join(''):'<div class="empty">Nothing scheduled</div>')+'</div>'}).join('')+'</div>'}async function renderCalendar(){card.classList.add('active');try{const r=await fetch('personal/calendar-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json(),events=(data.events||[]).map(e=>({...e,start:new Date(e.start),end:e.end?new Date(e.end):null}));renderAgenda(events);if(data.updated)calendarSync.textContent='Synced '+new Date(data.updated).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})}catch{content.innerHTML='<p class="calendar-error">Calendar data is temporarily unavailable.</p>'}}renderCalendar();
</script></body></html>
